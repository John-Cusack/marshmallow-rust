[workspace]
members = ["marshmallow-core"]
resolver = "2"

[package]
name = "marshmallow-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the marshmallow-rust port"
license = "MIT"
repository = "https://github.com/John-Cusack/marshmallow-rust"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
marshmallow-core = { version = "0.1.0", path = "marshmallow-core" }
pyo3 = { version = "0.24", features = ["extension-module"] }
